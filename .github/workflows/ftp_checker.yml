name: FTP Change Detector

on:
  schedule:
    # מריץ את הבדיקה בכל שעה (ניתן לשנות לפי הצרכים שלך)
    - cron: '0 * * * *'
  workflow_dispatch: # מאפשר להריץ ידנית מהאתר של GitHub

jobs:
  check-ftp:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # שחזור מצב הקבצים הקודם מה-Cache של GitHub
    - name: Restore FTP State Cache
      uses: actions/cache@v4
      with:
        path: ftp_state.json
        key: ftp-state-key-${{ github.run_id }}
        restore-keys: |
          ftp-state-key-

    # הרצת סקריפט הבדיקה עם משתני ה-Secrets
    - name: Run FTP Checker
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        FTP_DIR: '/' # שנה לתיקייה המבוקשת בשרת אם צריך
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      run: python check_ftp.py

    # שמירת המצב החדש ב-Cache לריצה הבאה
    - name: Save FTP State Cache
      uses: actions/cache/save@v4
      if: always() # שומר גם אם הסקריפט נכשל או הצליח
      with:
        path: ftp_state.json
        key: ftp-state-key-${{ github.run_id }}

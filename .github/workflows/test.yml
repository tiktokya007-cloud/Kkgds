name: Manual FTP Connection Check10

# הגדרת הפעלה ידנית מתוך לשונית Actions ב-GitHub
on:
  workflow_dispatch:

jobs:
  check-ftp:
    runs-on: ubuntu-latest
    
    steps:
      # 1. הורדת הקוד מהריפוזיטורי שלך
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. הגדרת סביבת פייתון
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. הפעלת הסקריפט והעברת ה-Secrets כמשתני סביבה
      - name: Run FTP Connection Script
        env:
          FTP_HOST: ${{ secrets.FTP_HOST0 }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          python .github/scripts/ftp_check.py

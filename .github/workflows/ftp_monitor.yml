name: FTP Monitor

on:
  schedule:
    # מריץ את הבדיקה כל שעה (ניתן לשנות לפי הצורך, למשל '*/30 * * * *' לכל חצי שעה)
    - cron: '0 * * * *'
  workflow_dispatch: # מאפשר הפעלה ידנית מתוך ממשק ה-GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run FTP Monitor Script
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          python ftp_monitor.py

      - name: Commit and push state changes (if any)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ftp_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update FTP state [skip ci]" && git push)

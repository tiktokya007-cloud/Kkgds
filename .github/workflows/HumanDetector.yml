name: Manual FTP Human Detector Run

# מאפשר הפעלה ידנית מתוך ממשק GitHub
on:
  workflow_dispatch:

jobs:
  run-detector:
    runs-on: ubuntu-latest

    steps:
    # 1. שליפת הקוד מתוך ה-Repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. התקנת סביבת פייתון
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. התקנת התלויות שהקוד שלך דורש (החלפת opencv בגרסת ה-contrib)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-contrib-python-headless numpy requests

    # 4. הרצת הסקריפט עם משתני הסביבה
    - name: Run Python Script
      env:
        FTP_HOST0: ${{ secrets.FTP_HOST0 }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        FTP_FOLDER: ${{ secrets.FTP_FOLDER }}
        PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        POLL_INTERVAL: "10"
      run: python HumanDetector.py

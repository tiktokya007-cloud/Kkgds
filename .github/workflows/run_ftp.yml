name: Monitor FTP and Notify Pushover

on:
  schedule:
    - cron: '0 * * * *' # רץ אוטומטית בכל שעה עגולה
  workflow_dispatch: # הפעלה ידנית לבדיקה

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    # 1. שליפת הקוד מהרפוזיטורי
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. התקנת פייתון
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. התקנת ספריית requests
    - name: Install dependencies
      run: pip install requests

    # 4. שחזור קובץ המצב הקודם מה-Cache (שימוש במפתח קבוע)
    - name: Restore FTP Snapshot Cache
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: ftp_snapshot.txt
        key: ftp-snapshot-v1 # מפתח קבוע כדי לשלוף תמיד את המצב האחרון שנשמר

    # 5. הרצת קוד הפייתון
    - name: Run Monitor Script
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      run: python main.py

    # 6. בדיקה האם הקובץ קיים, ואם לא - יצירת קובץ ריק כדי למנוע את שגיאת ה-Cache
    - name: Ensure Snapshot File Exists
      run: touch ftp_snapshot.txt

    # 7. שמירת קובץ המצב המעודכן (מחיקת ה-Cache הישן ושמירת החדש תחת אותו מפתח)
    - name: Save Updated FTP Snapshot to Cache
      uses: actions/cache/save@v4
      with:
        path: ftp_snapshot.txt
        key: ftp-snapshot-v1-${{ github.run_number }} # משתמש במספר הריצה כדי לאלץ שמירה מעודכנת

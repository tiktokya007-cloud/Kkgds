name: Run TrgetDir FTP Monitor

on:
  workflow_dispatch: # מאפשר הפעלה ידנית מהממשק של GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # שחזור קובץ ה-Cache מהריצה הקודמת (כדי למנוע התראות כפולות)
    - name: Restore Cache File
      uses: actions/cache/restore@v4
      with:
        path: seen_files_cache.txt
        key: ftp-cache-${{ github.run_id }}
        restore-keys: |
          ftp-cache-

    - name: Run script
      env:
        ftp_host: ${{ secrets.FTP_HOST }}
        ftp_user: ${{ secrets.FTP_USER }}
        ftp_pass: ${{ secrets.FTP_PASS }}
        ftp_target_dir: ${{ secrets.FTP_TARGET_DIR }} # אופציונלי - אם לא יוגדר ישתמש בברירת המחדל שבקוד
        pushover_user_key: ${{ secrets.PUSHOVER_USER_KEY }}
        pushover_api_token: ${{ secrets.PUSHOVER_API_TOKEN }}
      run: python TrgetDir.py # החלף בשם קובץ ה-Python שלך

    # שמירת קובץ ה-Cache המעודכן לשימוש בריצה הבאה
    - name: Save Cache File
      if: always()
      uses: actions/cache/save@v4
      with:
        path: seen_files_cache.txt
        key: ftp-cache-${{ github.run_id }}
